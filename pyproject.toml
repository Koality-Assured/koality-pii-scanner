[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koality-pii-scanner"
dynamic = ["version"]
description = "Deterministic PII, credential, and sensitive data scanner for codebases, artifacts, and AI agent workflows"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Koality Assured" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Koality-Assured/koality-pii-scanner"
Repository = "https://github.com/Koality-Assured/koality-pii-scanner"
Issues = "https://github.com/Koality-Assured/koality-pii-scanner/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[project.scripts]
koality-pii-scan = "pii_scan.cli:main"
pii-scan = "pii_scan.cli:main"

[tool.hatch.version]
path = "src/pii_scan/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pii_scan"]

[tool.hatch.build.targets.wheel.force-include]
"src/pii_scan/data" = "pii_scan/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
[tool.setuptools]
packages = []
